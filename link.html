<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>こども れんしゅう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6E5; --tile:#FFE3B8; --card:#FFFFFF; --ink:#3E2E4A; --soft:#7A6A86;
  color-scheme: light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2A2230; --tile:#3D3245; --card:#352B3D; --ink:#FFF4EA; --soft:#CDBFD6; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#2A2230; --tile:#3D3245; --card:#352B3D; --ink:#FFF4EA; --soft:#CDBFD6; color-scheme:dark;
}
*,*::before,*::after{ box-sizing:border-box; }
html{ height:100%; }
body{
  margin:0; min-height:100%;
  background-color:var(--bg);
  background-image:radial-gradient(var(--tile) 3px, transparent 3.5px);
  background-size:36px 36px;
  color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  font-weight:700;
  -webkit-tap-highlight-color:transparent;
}
.wrap{ max-width:880px; margin:0 auto; padding:28px 16px 32px; }
h1{ font-size:clamp(28px, 7vw, 40px); font-weight:900; text-align:center; margin:0 0 6px; letter-spacing:.04em; }
.lead{ text-align:center; color:var(--soft); font-size:17px; margin:0 0 24px; }
.list{ list-style:none; padding:0; margin:0; display:grid; gap:16px; grid-template-columns:1fr; }
@media (min-width:720px){ .list{ grid-template-columns:repeat(3, 1fr); } }
.card{
  display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px;
  background:var(--card); color:inherit; text-decoration:none;
  border-radius:28px; padding:22px 18px 20px;
  border-top:10px solid var(--c);
  box-shadow:0 6px 0 var(--tile);
  transition:transform .12s, box-shadow .12s;
}
.card:hover{ transform:translateY(-3px); box-shadow:0 9px 0 var(--tile); }
.card:active{ transform:translateY(3px); box-shadow:0 2px 0 var(--tile); }
.card:focus-visible{ outline:4px solid var(--c); outline-offset:4px; }
.icon{
  display:grid; place-items:center; width:96px; height:96px; border-radius:50%;
  background:var(--tint); font-size:52px; line-height:1;
}
.card h2{ margin:4px 0 0; font-size:24px; font-weight:900; }
.card p{ margin:0; font-size:15px; line-height:1.6; color:var(--soft); font-weight:500; }
.go{
  margin-top:8px; display:inline-block; padding:10px 26px; border-radius:999px;
  background:var(--c); color:#fff; font-size:18px; font-weight:900;
}
.hamigaki{ --c:#3FB7A6; --tint:#D8F3EE; }
.toire{ --c:#4FA3E8; --tint:#DDEBFF; }
.katazuke{ --c:#FF7FA6; --tint:#FFE3EE; }
</style>
</head>
<body>
<main class="wrap">
  <h1>こども れんしゅう</h1>
  <p class="lead">やってみたい れんしゅうを えらんでね</p>
  <ul class="list">
    <li>
      <a class="card hamigaki" href="hamigaki.html">
        <span class="icon" aria-hidden="true">🦷</span>
        <h2>はみがき</h2>
        <p>どうぶつと いっしょに<br>はを ぴかぴかに しよう</p>
        <span class="go">はじめる</span>
      </a>
    </li>
    <li>
      <a class="card toire" href="toire.html">
        <span class="icon" aria-hidden="true">🚽</span>
        <h2>トイレ</h2>
        <p>くまくんの まねっこで<br>トイレで おしっこ しよう</p>
        <span class="go">はじめる</span>
      </a>
    </li>
    <li>
      <a class="card katazuke" href="katazuke.html">
        <span class="icon" aria-hidden="true">🧸</span>
        <h2>おかたづけ</h2>
        <p>ひなこちゃんと いっしょに<br>おへやを かたづけよう</p>
        <span class="go">はじめる</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
