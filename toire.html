<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>くまくんと トイレ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#DDEBFF; --tile:#C7DBF7; --card:#FFFFFF; --ink:#24345E; --soft:#5B6B90;
  --pink:#FF7FA6; --pink-deep:#E2557F; --lemon:#FFD84D; --lemon-ink:#6B5200;
  --blue:#4FA3E8; --blue-deep:#2F7CC0; --track:#EAF2FF; --hint:#FFF6D6; --hint-ink:#6B5200;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13233F; --tile:#1D3358; --card:#22395F; --ink:#F3F8FF; --soft:#B7C6DE;
    --track:#2B4670; --hint:#3A3A26; --hint-ink:#FFE9A3; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13233F; --tile:#1D3358; --card:#22395F; --ink:#F3F8FF; --soft:#B7C6DE;
  --track:#2B4670; --hint:#3A3A26; --hint-ink:#FFE9A3; color-scheme:dark;
}
html{ height:100%; }
*,*::before,*::after{ box-sizing:border-box; }
body{
  margin:0; min-height:100%;
  background-color:var(--bg);
  background-image:
    radial-gradient(var(--tile) 3px, transparent 3.5px);
  background-size:36px 36px;
  color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  font-weight:700;
  -webkit-tap-highlight-color:transparent;
}
.wrap{ max-width:960px; margin:0 auto; padding:12px 16px 24px; }
.top{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
h1{ font-size:20px; font-weight:900; margin:0; letter-spacing:.04em; }
.tools{ display:flex; gap:8px; }
.ghost{
  font:inherit; font-size:14px; color:var(--ink); background:var(--card);
  border:2px solid var(--tile); border-radius:999px; padding:6px 14px; cursor:pointer;
}

/* progress */
.steps{ display:flex; gap:6px; list-style:none; padding:0; margin:0 0 10px; justify-content:center; flex-wrap:wrap; }
.steps li{
  display:flex; align-items:center; gap:4px;
  font-size:14px; padding:6px 12px; border-radius:999px; background:var(--card); color:var(--soft);
  border:2px solid var(--tile);
}
.steps li .n{ display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--track); font-size:13px; }
.steps li.now{ background:var(--lemon); color:var(--lemon-ink); border-color:var(--lemon); transform:scale(1.08); }
.steps li.now .n{ background:#fff; }
.steps li.fin{ color:var(--ink); }
.steps li.fin .n{ background:var(--pink); color:#fff; }
.steps li.fin .n::before{ content:"★"; }
.steps li.fin .n span{ display:none; }
.steps li.got{ animation:got .7s cubic-bezier(.3,1.8,.5,1); }
@keyframes got{ 0%{ transform:scale(.6); } 60%{ transform:scale(1.3); } 100%{ transform:scale(1); } }

.stage{ display:grid; gap:12px; grid-template-columns:1fr; }
@media (min-width:780px){ .stage{ grid-template-columns:1.35fr 1fr; align-items:start; } } }
.panel{ background:var(--card); border-radius:28px; padding:10px; position:relative; box-shadow:0 5px 0 var(--tile); }
.scenebox{ overflow:hidden; padding:0; }
.scenebox svg{ width:100%; height:auto; display:block; border-radius:28px; }
.guide{ padding:16px 18px 18px; display:flex; flex-direction:column; }
.stepno{ margin:0; font-size:15px; color:var(--soft); }
#title{ margin:2px 0 6px; font-size:34px; font-size:clamp(30px, 8vw, 44px); font-weight:900; line-height:1.2; }
#tip{ margin:4px 0 10px; font-size:19px; line-height:1.7; font-weight:700; }
.turn{
  margin:0 0 10px; font-size:20px; font-weight:900; color:var(--pink-deep);
  min-height:1.5em;
}
.turn.wait{ color:var(--soft); }
.turn.go{ animation:bob 1s ease-in-out infinite; }
@keyframes bob{ 50%{ transform:translateY(-4px); } }
.hint{
  margin:0 0 14px; font-size:13px; line-height:1.6; font-weight:500;
  background:var(--hint); color:var(--hint-ink); border-radius:14px; padding:8px 12px;
}
.controls{ display:flex; gap:10px; flex-wrap:wrap; margin-top:auto; }
.big, .sub{
  font:inherit; font-weight:900; border:none; border-radius:999px; cursor:pointer;
  transition:transform .1s, box-shadow .1s, opacity .2s;
  flex:1 1 180px; min-height:64px;
}
.big{ font-size:24px; color:#fff; background:var(--pink); padding:14px 22px; box-shadow:0 6px 0 var(--pink-deep); }
.big:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--pink-deep); }
.sub{ font-size:21px; color:#fff; background:var(--blue); padding:14px 22px; box-shadow:0 6px 0 var(--blue-deep); }
.sub:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--blue-deep); }
.big:disabled, .sub:disabled{ opacity:.35; cursor:default; transform:none; }
.big.ready{ animation:pulse 1.2s ease-in-out infinite; }
@keyframes pulse{ 50%{ transform:scale(1.05); } }
button:focus-visible{ outline:4px solid var(--lemon); outline-offset:3px; }

/* svg motion helpers */
#scene .mv{ transform-box:view-box; transform-origin:0 0; }
#scene .ctr{ transform-box:fill-box; transform-origin:center; }

/* confetti */
.confetti{ position:fixed; top:0; right:0; bottom:0; left:0; pointer-events:none; overflow:hidden; z-index:20; }
.confetti i{
  position:absolute; top:-20px; width:12px; height:16px; border-radius:3px;
  animation:fall linear forwards;
}
@keyframes fall{ to{ transform:translateY(110vh) rotate(720deg); } }

/* overlays */
.over{
  position:fixed; top:0; right:0; bottom:0; left:0; display:flex; align-items:center; justify-content:center;
  background:rgba(20,40,70,.5); padding:20px; z-index:10;
}
.over[hidden]{ display:none; }
.card{
  background:var(--card); border-radius:32px; padding:28px 24px; text-align:center; max-width:400px; width:100%;
  box-shadow:0 8px 0 var(--tile);
}
.card h2{ font-size:34px; margin:6px 0 8px; font-weight:900; color:var(--pink-deep); line-height:1.3; }
.card p{ font-size:18px; margin:0 0 18px; line-height:1.6; }
.card .big{ width:100%; flex:none; }
.emoji{ font-size:64px; line-height:1.1; }
.starrow{ font-size:40px; letter-spacing:4px; margin:4px 0 8px; }
.starrow span{ display:inline-block; opacity:0; color:#FFC21A; }
.starrow span.on{ animation:starin .5s cubic-bezier(.3,1.8,.5,1) forwards; }
@keyframes starin{ from{ opacity:0; transform:scale(.2) rotate(-90deg); } to{ opacity:1; transform:none; } }
.tally{ font-size:14px !important; color:var(--soft); margin:12px 0 0 !important; font-weight:500; }

@media (prefers-reduced-motion: reduce){
  .turn.go, .big.ready, .steps li.got{ animation:none; }
}
/* iOS 12 Safari: flex の gap が きかないときの すきま */
.nogap .tools > * + *{ margin-left:8px; }
.nogap .top > * + *{ margin-left:10px; }
.nogap .steps li{ margin:3px; }
.nogap .steps .n{ margin-right:4px; }
.nogap .controls > *{ margin:5px; }
</style>
<script>
/* iOS 12 Safari などの ふるい ブラウザ むけ：
   flex の gap が きかないときは .nogap を つけて margin で すきまを つくる */
(function(){
  var d = document.createElement("div");
  d.style.display = "flex"; d.style.flexDirection = "column"; d.style.rowGap = "1px";
  d.appendChild(document.createElement("div")); d.appendChild(document.createElement("div"));
  document.documentElement.appendChild(d);
  var ok = d.scrollHeight === 1;
  d.parentNode.removeChild(d);
  if(!ok) document.documentElement.className += " nogap";
})();
</script>
</head>

<script>
/* Web Animations API が つかえない ブラウザ（iOS 12 Safari など）むけの かんたんな かわり。
   このページで つかう ぶんだけ：transform / opacity / fill の キーフレーム、
   duration・delay・easing・iterations・fill:"forwards"、finished・cancel・commitStyles、
   document.getAnimations()。 */
(function(){
  if(window.Element && Element.prototype.animate && document.getAnimations &&
     window.Animation && Animation.prototype.commitStyles) return;

  var running = [], held = [], raf = 0;
  var NAMED = { linear:[0,0,1,1], ease:[.25,.1,.25,1], "ease-in":[.42,0,1,1], "ease-out":[0,0,.58,1], "ease-in-out":[.42,0,.58,1] };
  function bezier(p){
    var x1 = p[0], y1 = p[1], x2 = p[2], y2 = p[3];
    if(x1 === y1 && x2 === y2) return function(x){ return x; };
    var cx = 3*x1, bx = 3*(x2-x1) - cx, ax = 1 - cx - bx;
    var cy = 3*y1, by = 3*(y2-y1) - cy, ay = 1 - cy - by;
    return function(x){
      var t = x;
      for(var i=0; i<8; i++){
        var e = ((ax*t + bx)*t + cx)*t - x, d = (3*ax*t + 2*bx)*t + cx;
        if(Math.abs(e) < 1e-5 || Math.abs(d) < 1e-6) break;
        t -= e/d;
      }
      t = Math.max(0, Math.min(1, t));
      return ((ay*t + by)*t + cy)*t;
    };
  }
  function easing(s){
    s = String(s || "linear").trim();
    var m = /^cubic-bezier\(([^)]+)\)$/.exec(s);
    return bezier(m ? m[1].split(",").map(Number) : (NAMED[s] || NAMED.linear));
  }

  // おなじ かたちの もじれつ（"translate(1px,2px) scale(1)" など）は かずを まぜる。いろは #rrggbb を まぜる。
  var NUM = /-?(?:\d+\.?\d*|\.\d+)(?:e[-+]?\d+)?/gi, HEX = /^#[0-9a-f]{3}(?:[0-9a-f]{3})?$/i;
  function rgb(c){
    var h = c.slice(1);

      chip:"ながす", title:"ながそう",
      tip:"レバーを ぐいっ！ ジャー！ おしっこ ばいばーい！",
      hint:"大人の方へ：音が怖い子は、最初は大人が流して見せてあげましょう。",
      voice:"さいごは ながそう。レバーを ぐいっ！", turn:"レバーで ながして みよう！",
      async play(r){
        await r.all(
          tween(el.armL, [{ transform:GRIP_L }, { transform:ARM_L }], { duration:350 }),
          tween(el.armR, [{ transform:GRIP_R }, { transform:ARM_R }], { duration:350 })
        );
        sfx.boing();
        pop("ぴょん", 260, 60);
        await r.all(
          tween(el.bearMove, [
            { transform:SEAT },
            { transform:"translate(90px,-115px)", offset:.5 },
            { transform:BYTOILET }
          ], { duration:850 }),
          tween(el.standLegs, [{ opacity:0 }, { opacity:1 }], { duration:120, delay:380 }),
          tween(el.sitLegs, [{ opacity:1 }, { opacity:0 }], { duration:120, delay:380 })
        );
        await r.wait(250);
        await r.tw(el.armR, [{ transform:ARM_R }, { transform:"rotate(-158deg)" }], { duration:550 });
        sfx.click();
        await r.tw(el.lever, [{ transform:"rotate(0deg)" }, { transform:"rotate(-28deg)" }], { duration:220 });
        sfx.flush();
        pop("ジャー！", 320, 92, { size:40, color:"#2F7CC0", hold:1500 });
        bubbles();
        await r.all(
          tween(el.swirl, [{ opacity:0, transform:"rotate(0deg)" }, { opacity:1, transform:"rotate(300deg)", offset:.2 }, { opacity:1, transform:"rotate(1100deg)", offset:.85 }, { opacity:0, transform:"rotate(1300deg)" }], { duration:2600, easing:"linear" }),
          tween(el.water, [{ fill:PEE }, { fill:WATER }], { duration:2000, delay:300 }),
          tween(el.lever, [{ transform:"rotate(-28deg)" }, { transform:"rotate(0deg)" }], { duration:300, delay:500 }),
          tween(el.armR, [{ transform:"rotate(-158deg)" }, { transform:"rotate(-130deg)" }], { duration:400, delay:600 })
        );
        happy(true);
        pop("おしっこ ばいばーい！", 215, 40, { size:26, hold:1600 });
        await r.tw(el.armR, [
          { transform:"rotate(-130deg)" }, { transform:"rotate(-160deg)" }, { transform:"rotate(-130deg)" },
          { transform:"rotate(-160deg)" }, { transform:"rotate(-130deg)" }
        ], { duration:1400 });
        await r.all(
          tween(el.armR, [{ transform:"rotate(-130deg)" }, { transform:ARM_R }], { duration:400 }),
          tween(el.inset, [{ opacity:1 }, { opacity:0 }], { duration:500 })
        );
        happy(false);
      }
    }
  ];

  /* ---------- progress ---------- */
  const stepsUl = $("steps");
  STEPS.forEach((s, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="n"><span>${i+1}</span></span>${s.chip}`;
    stepsUl.appendChild(li);
  });
  const chips = [...stepsUl.children];
  function paintChips(cur){
    chips.forEach((c, i) => {
      c.classList.toggle("fin", i < cur);
      c.classList.toggle("now", i === cur);
    });
  }

  /* ---------- flow ---------- */
  let cur = 0;
  const okBtn = $("okBtn"), againBtn = $("againBtn"), turn = $("turn");
  function buttons(on){
    okBtn.disabled = againBtn.disabled = !on;
    okBtn.classList.toggle("ready", on);
  }

  async function show(i){
    cur = i;
    const s = STEPS[i];
    setState(i);
    paintChips(i);
    $("stepNo").textContent = `${i+1} / ${STEPS.length}`;
    $("title").textContent = s.title;
    $("tip").textContent = s.tip;
    $("hint").textContent = s.hint;
    okBtn.textContent = i === STEPS.length-1 ? "⭕ できた！" : "⭕ できた！ つぎへ";
    turn.textContent = "くまくんを みててね 👀";
    turn.className = "turn wait";
    buttons(false);
    speak(s.voice);
    const r = runner();
    try{
      await r.wait(700);
      await s.play(r);
    }catch(e){ if(e === "abort") return; throw e; }
    turn.textContent = "こんどは はるくんの ばん！ " + s.turn;
    turn.className = "turn go";
    speak("こんどは はるくんの ばん！ " + s.turn);
    buttons(true);
  }

  const PRAISE = ["すごい！", "じょうず！", "やったね！", "かっこいい！"];
  okBtn.addEventListener("click", async () => {
    if(okBtn.disabled) return;
    buttons(false);
    if(cur < STEPS.length-1){ show(cur+1); return; }
    const word = PRAISE[Math.floor(Math.random()*PRAISE.length)];
    turn.textContent = word + " ⭐";
    turn.className = "turn";
    sfx.yay(); speak(word);
    chips[cur].classList.add("fin"); chips[cur].classList.remove("now");
    chips[cur].classList.remove("got"); void chips[cur].offsetWidth; chips[cur].classList.add("got");
    confetti(40);
    happy(true);
    pop(word, 215, 40, { size:36 });
    bob(2);
    const myRun = runId;
    await sleep(1600);
    if(myRun !== runId) return;
    finish();
  });
  againBtn.addEventListener("click", () => {
    if(againBtn.disabled) return;
    show(cur);
  });

  function confetti(n){
    const box = $("confetti");
    const colors = ["#FF7FA6","#FFD84D","#4FA3E8","#7BD389","#FFB84D"];
    for(let i=0;i<n;i++){
      const c = document.createElement("i");
      c.style.left = Math.random()*100 + "vw";
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = (1.6 + Math.random()*1.4) + "s";
      c.style.animationDelay = (Math.random()*.4) + "s";
      box.appendChild(c);
      setTimeout(() => c.remove(), 3500);
    }
  }

  function readTally(){ try{ return parseInt(localStorage.getItem("toire-tally") || "0", 10) || 0; }catch(e){ return 0; } }
  function finish(){
    paintChips(STEPS.length);
    let n = readTally() + 1;
    try{ localStorage.setItem("toire-tally", String(n)); }catch(e){}
    $("tally").textContent = `トイレ できた かず：${n}かい`;
    const stars = [...$("starRow").children];
    stars.forEach(s => s.classList.remove("on"));
    $("doneOver").hidden = false;
    stars.forEach((s, i) => setTimeout(() => { s.classList.add("on"); tone(660 + i*110, .15, { type:"triangle", gain:.15 }); }, 300 + i*220));
    setTimeout(() => sfx.fanfare(), 1500);
    confetti(80);
    speak("ぜんぶ できたね！ トイレで おしっこ できる、かっこいい おにいさん！");
  }

  $("startBtn").addEventListener("click", () => {
    ac();
    $("startOver").hidden = true;
    show(0);
  });
  $("replayBtn").addEventListener("click", () => {
    $("doneOver").hidden = true;
    show(0);
  });
  $("restartBtn").addEventListener("click", () => {
    hush();
    $("doneOver").hidden = true;
    $("startOver").hidden = true;
    show(0);
  });

  // 最初の表示
  setState(0);
  paintChips(0);
  $("stepNo").textContent = `1 / ${STEPS.length}`;
  $("title").textContent = STEPS[0].title;
  $("tip").textContent = STEPS[0].tip;
  $("hint").textContent = STEPS[0].hint;
})();
</script>
</body>
</html>
