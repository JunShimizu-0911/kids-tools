<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひなこの おかたづけ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFE9F1; --tile:#FFD3E3; --card:#FFFFFF; --ink:#4A2B3F; --soft:#8A6A80;
  --pink:#FF7FA6; --pink-deep:#E2557F; --lemon:#FFD84D; --lemon-ink:#6B5200;
  --blue:#4FA3E8; --blue-deep:#2F7CC0; --track:#FFF0F6; --hint:#FFF6D6; --hint-ink:#6B5200;
  color-scheme: light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2E1B28; --tile:#45293B; --card:#3A2333; --ink:#FFF0F6; --soft:#D9B8CB;
    --track:#4A2D40; --hint:#3A3A26; --hint-ink:#FFE9A3; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#2E1B28; --tile:#45293B; --card:#3A2333; --ink:#FFF0F6; --soft:#D9B8CB;
  --track:#4A2D40; --hint:#3A3A26; --hint-ink:#FFE9A3; color-scheme:dark;
}
html{ height:100%; }
*,*::before,*::after{ box-sizing:border-box; }
body{
  margin:0; min-height:100%;
  background-color:var(--bg);
  background-image:radial-gradient(var(--tile) 3px, transparent 3.5px);
  background-size:36px 36px;
  color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  font-weight:700;
  -webkit-tap-highlight-color:transparent;
}
.wrap{ max-width:1040px; margin:0 auto; padding:12px 16px 24px; }
.top{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
h1{ font-size:20px; font-weight:900; margin:0; letter-spacing:.04em; }
.tools{ display:flex; gap:8px; }
.ghost{
  font:inherit; font-size:14px; color:var(--ink); background:var(--card);
  border:2px solid var(--tile); border-radius:999px; padding:6px 14px; cursor:pointer;
}

/* step jump buttons */
.steps{ display:flex; gap:6px; list-style:none; padding:0; margin:0 0 10px; justify-content:center; flex-wrap:wrap; }
.steps button{
  font:inherit; font-size:14px; display:flex; align-items:center; gap:4px; cursor:pointer;
  padding:6px 12px; border-radius:999px; background:var(--card); color:var(--soft);
  border:2px solid var(--tile);
}
.steps .n{ display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--track); font-size:13px; }
.steps button.now{ background:var(--lemon); color:var(--lemon-ink); border-color:var(--lemon); transform:scale(1.08); }
.steps button.now .n{ background:#fff; }
.steps button.fin{ color:var(--ink); }
.steps button.fin .n{ background:var(--pink); color:#fff; }
.steps button.fin .n::before{ content:"★"; }
.steps button.fin .n span{ display:none; }

.stage{ display:grid; gap:12px; grid-template-columns:1fr; }
@media (min-width:820px){ .stage{ grid-template-columns:1.6fr 1fr; align-items:start; } }
.panel{ background:var(--card); border-radius:28px; padding:10px; position:relative; box-shadow:0 5px 0 var(--tile); }
.scenebox{ overflow:hidden; padding:0; }
.scenebox svg{ width:100%; height:auto; display:block; }
.guide{ padding:16px 18px 18px; display:flex; flex-direction:column; }
.stepno{ margin:0; font-size:15px; color:var(--soft); }
#title{ margin:2px 0 6px; font-size:30px; font-size:clamp(26px, 6.5vw, 36px); font-weight:900; line-height:1.25; }
#tip{ margin:4px 0 10px; font-size:18px; line-height:1.7; }
.turn{ margin:0 0 10px; font-size:19px; font-weight:900; color:var(--pink-deep); min-height:1.5em; }
.turn.wait{ color:var(--soft); }
.turn.go{ animation:bob 1s ease-in-out infinite; }
@keyframes bob{ 50%{ transform:translateY(-4px); } }
.timebar{ margin:0 0 14px; }
.tb-row{ display:flex; justify-content:space-between; align-items:baseline; font-size:15px; color:var(--soft); margin-bottom:6px; }
.tb-row b{ font-size:22px; color:var(--ink); font-variant-numeric:tabular-nums; }
#barLabel.ask{ color:var(--pink-deep); font-size:18px; font-weight:900; }
.bar{ height:20px; background:var(--track); border:2px solid var(--tile); border-radius:999px; overflow:hidden; }
.bar span{ display:block; height:100%; width:0; background:linear-gradient(90deg,#FFB3CC,var(--pink)); border-radius:999px; transition:width .5s linear; }
.big{
  font:inherit; font-weight:900; font-size:24px; color:#fff; background:var(--pink);
  border:none; border-radius:999px; padding:14px 22px; cursor:pointer; min-height:64px; width:100%;
  box-shadow:0 6px 0 var(--pink-deep); transition:transform .1s, box-shadow .1s, opacity .2s;
}
.big:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--pink-deep); }
.big:disabled{ opacity:.35; cursor:default; transform:none; }
.big.ready{ animation:pulse 1.2s ease-in-out infinite; }
@keyframes pulse{ 50%{ transform:scale(1.04); } }
.sub{
  font:inherit; font-weight:900; font-size:20px; color:#fff; background:var(--blue);
  border:none; border-radius:999px; padding:12px 22px; cursor:pointer; min-height:56px; width:100%;
  box-shadow:0 6px 0 var(--blue-deep);
}
button:focus-visible{ outline:4px solid var(--lemon); outline-offset:3px; }

#scene .mv{ transform-box:view-box; transform-origin:0 0; }
#scene .ctr{ transform-box:fill-box; transform-origin:center; }

/* overlays */
.over{
  position:fixed; top:0; right:0; bottom:0; left:0; display:flex; align-items:center; justify-content:center;
  background:rgba(60,20,45,.5); padding:20px; z-index:10;
}
.over[hidden]{ display:none; }
.card{
  background:var(--card); border-radius:32px; padding:28px 24px; text-align:center; max-width:400px; width:100%;
  box-shadow:0 8px 0 var(--tile); display:flex; flex-direction:column; gap:12px;
}
.card h2{ font-size:32px; margin:4px 0 0; font-weight:900; color:var(--pink-deep); line-height:1.3; }
.card p{ font-size:18px; margin:0 0 6px; line-height:1.6; }
.emoji{ font-size:60px; line-height:1.1; }
.starrow{ font-size:36px; letter-spacing:2px; }
.starrow span{ display:inline-block; opacity:0; color:#FFC21A; }
.starrow span.on{ animation:starin .5s cubic-bezier(.3,1.8,.5,1) forwards; }
@keyframes starin{ from{ opacity:0; transform:scale(.2) rotate(-90deg); } to{ opacity:1; transform:none; } }
.confetti{ position:fixed; top:0; right:0; bottom:0; left:0; pointer-events:none; overflow:hidden; z-index:20; }
.confetti i{ position:absolute; top:-20px; width:12px; height:16px; border-radius:3px; animation:fall linear forwards; }
@keyframes fall{ to{ transform:translateY(110vh) rotate(720deg); } }

@media (prefers-reduced-motion: reduce){
  .turn.go, .big.ready{ animation:none; }
}
/* iOS 12 Safari: flex の gap が きかないときの すきま */
.nogap .tools > * + *{ margin-left:8px; }
.nogap .top > * + *{ margin-left:10px; }
.nogap .steps li{ margin:3px; }
.nogap .steps .n{ margin-right:4px; }
.nogap .card > * + *{ margin-top:12px; }
</style>
<script>
/* iOS 12 Safari などの ふるい ブラウザ むけ：
   flex の gap が きかないときは .nogap を つけて margin で すきまを つくる */
(function(){
  var d = document.createElement("div");
  d.style.display = "flex"; d.style.flexDirection = "column"; d.style.rowGap = "1px";
  d.appendChild(document.createElement("div")); d.appendChild(document.createElement("div"));
  document.documentElement.appendChild(d);
  var ok = d.scrollHeight === 1;
  d.parentNode.removeChild(d);
  if(!ok) document.documentElement.className += " nogap";
})();
</script>

<script>
/* Web Animations API が つかえない ブラウザ（iOS 12 Safari など）むけの かんたんな かわり。
   このページで つかう ぶんだけ：transform / opacity / fill の キーフレーム、
   duration・delay・easing・iterations・fill:"forwards"、finished・cancel・commitStyles、
   document.getAnimations()。 */
(function(){
  if(window.Element && Element.prototype.animate && document.getAnimations &&
     window.Animation && Animation.prototype.commitStyles) return;

  var running = [], held = [], raf = 0;
  var NAMED = { linear:[0,0,1,1], ease:[.25,.1,.25,1], "ease-in":[.42,0,1,1], "ease-out":[0,0,.58,1], "ease-in-out":[.42,0,.58,1] };
  function bezier(p){
    var x1 = p[0], y1 = p[1], x2 = p[2], y2 = p[3];
    if(x1 === y1 && x2 === y2) return function(x){ return x; };
    var cx = 3*x1, bx = 3*(x2-x1) - cx, ax = 1 - cx - bx;
    var cy = 3*y1, by = 3*(y2-y1) - cy, ay = 1 - cy - by;
    return function(x){
      var t = x;
      for(var i=0; i<8; i++){
        var e = ((ax*t + bx)*t + cx)*t - x, d = (3*ax*t + 2*bx)*t + cx;
        if(Math.abs(e) < 1e-5 || Math.abs(d) < 1e-6) break;
        t -= e/d;
      }
      t = Math.max(0, Math.min(1, t));
      return ((ay*t + by)*t + cy)*t;
    };
  }
  function easing(s){
    s = String(s || "linear").trim();
    var m = /^cubic-bezier\(([^)]+)\)$/.exec(s);
    return bezier(m ? m[1].split(",").map(Number) : (NAMED[s] || NAMED.linear));
  }

  // おなじ かたちの もじれつ（"translate(1px,2px) scale(1)" など）は かずを まぜる。いろは #rrggbb を まぜる。
  var NUM = /-?(?:\d+\.?\d*|\.\d+)(?:e[-+]?\d+)?/gi, HEX = /^#[0-9a-f]{3}(?:[0-9a-f]{3})?$/i;
  function rgb(c){
    var h = c.slice(1);
    if(h.length === 3) h = h.replace(/./g, "$&$&");
    var n = parseInt(h, 16);
    return [n >> 16 & 255, n >> 8 & 255, n & 255];
  }
  function mix(a, b, t){
    a = String(a); b = String(b);
    if(HEX.test(a) && HEX.test(b)){
      var A = rgb(a), B = rgb(b);
      return "rgb(" + A.map(function(v, i){ return Math.round(v + (B[i]-v)*t); }).join(",") + ")";
    }
    var na = a.match(NUM) || [], nb = b.match(NUM) || [];
    if(na.length === nb.length && a.replace(NUM, "#") === b.replace(NUM, "#")){
      var i = 0;
      return a.replace(NUM, function(){
        var v = +na[i] + (+nb[i] - +na[i])*t; i++;
        return String(Math.round(v*1000)/1000);
      });
    }
    return t < .5 ? a : b;
  }

  function Anim(el, frames, opt){
    if(typeof opt === "number") opt = { duration:opt };
    opt = opt || {};
    var self = this, n = frames.length;
    this.el = el;
    this.dur = Math.max(1, opt.duration || 0);
    this.delay = opt.delay || 0;
    this.iter = opt.iterations || 1;
    this.hold = opt.fill === "forwards" || opt.fill === "both";
    this.ease = easing(opt.easing);
    this.frames = frames.map(function(f, i){
      var c = {}; for(var k in f) c[k] = f[k];
      if(c.offset == null) c.offset = n === 1 ? 1 : i/(n-1);
      return c;
    });
    this.props = [];
    frames.forEach(function(f){
      for(var k in f) if(k !== "offset" && k !== "easing" && self.props.indexOf(k) < 0) self.props.push(k);
    });
    this.saved = {};
    this.props.forEach(function(p){ self.saved[p] = el.style[p]; });
    this.start = performance.now();
    this.done = false; this.committed = false;
    this.finished = new Promise(function(res, rej){ self._res = res; self._rej = rej; });
    this.finished.catch(function(){});
    running.push(this);
    this._tick(this.start);
    loop();
  }
  Anim.prototype._value = function(p, x){
    var fs = this.frames.filter(function(f){ return p in f; });
    if(fs.length === 1) return fs[0][p];
    var k = 0;
    while(k < fs.length-2 && x > fs[k+1].offset) k++;
    var a = fs[k], b = fs[k+1], span = b.offset - a.offset;
    return mix(a[p], b[p], span > 0 ? Math.max(0, Math.min(1, (x - a.offset)/span)) : 1);
  };
  Anim.prototype._apply = function(x){
    for(var i=0; i<this.props.length; i++) this.el.style[this.props[i]] = this._value(this.props[i], x);
  };
  Anim.prototype._restore = function(){
    for(var p in this.saved) this.el.style[p] = this.saved[p];
  };
  Anim.prototype._drop = function(){
    var i = running.indexOf(this); if(i >= 0) running.splice(i, 1);
    i = held.indexOf(this); if(i >= 0) held.splice(i, 1);
  };
  Anim.prototype._tick = function(now){
    var t = now - this.start - this.delay;
    if(t < 0 || this.done) return;
    if(t >= this.dur * this.iter){
      this._apply(1);
      this.done = true;
      this._drop();
      if(this.hold) held.push(this); else this._restore();
      this._res(this);
    } else {
      this._apply(this.ease((t % this.dur) / this.dur));
    }
  };
  Anim.prototype.commitStyles = function(){ this.committed = true; };
  Anim.prototype.cancel = function(){
    this._drop();
    if(!this.committed) this._restore();
    if(!this.done){
      this.done = true;
      var e = new Error("The animation was cancelled."); e.name = "AbortError";
      this._rej(e);
    }
  };
  function loop(){ if(!raf) raf = requestAnimationFrame(step); }
  function step(now){
    raf = 0;
    running.slice().forEach(function(a){ a._tick(now); });
    if(running.length) loop();
  }

  Element.prototype.animate = function(frames, opt){ return new Anim(this, frames, opt); };
  document.getAnimations = function(){ return running.concat(held); };
})();
</script>

    { step:2, svg:art.rabbit(), m:[470,560,30,1],  t:[80,470,-8,.9,.9], dst:"toy" },
    { step:2, svg:art.car(),    m:[600,540,-8,.8], t:[-50,470,-6,.5,.5], dst:"toy" },
    // 4 バッグ → ひだりの たなの まんなか
    { step:3, svg:art.paperBag(), m:[240,555,-78,.85], t:[-92,324,0,.55,.55], dst:"lshelf" },
    { step:3, svg:art.blackBag(), m:[715,575,14,.85],  t:[-44,337,0,.42,.42], dst:"lshelf" },
    // 5 ちいさい おもちゃ → おもちゃばこ
    { step:4, svg:art.ball(),            m:[505,590,0,1],   t:[-60,486,0,.9,.9], dst:"toy" },
    { step:4, svg:art.block("#FFCF2E"),  m:[150,585,20,1],  t:[-30,486,10,.9,.9], dst:"toy" },
    { step:4, svg:art.block("#4F8CE8"),  m:[775,590,-15,1], t:[10,488,-8,.9,.9], dst:"toy" },
    { step:4, svg:art.crayon(),          m:[330,585,40,1],  t:[45,488,-30,.9,.9], dst:"toy" },
    { step:4, svg:art.brush(),           m:[640,500,-35,1], t:[-95,478,20,.7,.7], dst:"toy" },
    { step:4, svg:art.wand(),            m:[470,495,25,1],  t:[-5,470,-10,.8,.8], dst:"toy" },
    { step:4, svg:art.doll(),            m:[300,495,-20,1], t:[70,486,0,.9,.9], dst:"toy" }
  ];
  const tf = (x, y, r, sx, sy) => `translate(${x}px,${y}px) rotate(${r}deg) scale(${sx},${sy === undefined ? sx : sy})`;
  const messT = it => tf(it.m[0], it.m[1], it.m[2], it.m[3]);
  const tidyT = it => tf(...it.t);
  // あとの だんかいの ものほど したに おく
  [...ITEMS].sort((a, b) => b.step - a.step).forEach(it => {
    it.el = mk("g", { class:"mv" });
    it.el.innerHTML = it.svg;
  });

  /* ---------- steps ---------- */
  const STEPS = [
    { chip:"えほん", title:"えほんを かたづけよう",
      tip:"ゆかの えほんを ひろって、たなの したに たてて ならべよう。",
      voice:"えほんを かたづけよう。たなの したに たてて ならべてね。" },
    { chip:"プリント", title:"プリントを かたづけよう",
      tip:"ちらばった プリントを あつめて、ひだりの たなの 「ぷりんと」ボックスに いれよう。",
      voice:"プリントを あつめて、ひだりの たなに しまおう。" },
    { chip:"シルバニア", title:"シルバニアを かたづけよう",
      tip:"にんぎょうや かぐ、くるまを おもちゃばこへ ないない！",
      voice:"シルバニアを おもちゃばこに かたづけよう。" },
    { chip:"バッグ", title:"バッグを かたづけよう",
      tip:"かみぶくろと くろい バッグを、ひだりの たなに きちんと しまおう。",
      voice:"バッグを ひだりの たなに しまおう。" },
    { chip:"おもちゃ", title:"ちいさい おもちゃを かたづけよう",
      tip:"ボールや つみき、ブラシを おもちゃばこへ ないない！",
      voice:"ちいさい おもちゃを おもちゃばこに ないない しよう。" },
    { chip:"かくにん", title:"ぜんぶ かたづいた？",
      tip:"ゆかに おもちゃが おちていないか、しっかり かくにん しよう！",
      voice:"ぜんぶ かたづいたかな？ ゆかに おもちゃが おちていないか、しっかり かくにん しよう！" }
  ];

  /* ---------- sound & voice ---------- */
  let soundOn = true, actx = null;
  function ac(){
    try{
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === "suspended") actx.resume();
    }catch(e){ actx = null; }
    return actx;
  }
  function tone(freq, dur, opt){
    const o0 = Object.assign({ type:"sine", gain:.18, to:0, delay:0 }, opt);
    const c = soundOn && ac(); if(!c) return;
    try{
      const t = c.currentTime + o0.delay;
      const o = c.createOscillator(), g = c.createGain();
      o.type = o0.type; o.frequency.setValueAtTime(freq, t);
      if(o0.to) o.frequency.exponentialRampToValueAtTime(o0.to, t + dur);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(o0.gain, t + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + .05);
    }catch(e){}
  }
  const sfx = {
    pick:  () => tone(420, .16, { to:880, gain:.2 }),
    place: () => { tone(660, .12, { type:"triangle", gain:.18 }); tone(990, .16, { type:"triangle", gain:.15, delay:.08 }); },
    step:  () => tone(180, .07, { to:120, type:"triangle", gain:.14 }),
    ask:   () => [784, 659, 784, 988].forEach((f, i) => tone(f, .2, { type:"triangle", gain:.18, delay:i*.15 })),
    ok:    () => [523, 659, 784].forEach((f, i) => tone(f, .22, { type:"triangle", gain:.16, delay:i*.09 })),
    fanfare:() => [523,659,784,659,784,1047].forEach((f,i) => tone(f, i===5?.7:.22, { type:"triangle", gain:.2, delay:i*.14 }))
  };
  function speak(text){
    if(!soundOn || !("speechSynthesis" in window)) return;
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ja-JP"; u.rate = .95; u.pitch = 1.3;
      const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("ja"));
      if(v) u.voice = v;
      speechSynthesis.speak(u);
    }catch(e){}
  }
  $("soundBtn").addEventListener("click", () => {
    soundOn = !soundOn;
    $("soundBtn").setAttribute("aria-pressed", soundOn);
    $("soundBtn").textContent = soundOn ? "🔊 おと あり" : "🔈 おと なし";
    if(!soundOn){ try{ speechSynthesis.cancel(); }catch(e){} }
  });

  /* ---------- animation helpers ---------- */
  let runId = 0;
  function tween(node, frames, opt){
    const a = node.animate(frames, Object.assign({ duration:600, easing:"ease-in-out", fill:"forwards" }, opt));
    return a.finished.then(() => { try{ a.commitStyles(); }catch(e){} a.cancel(); }, () => {});
  }
  function runner(){
    const id = ++runId;
    const chk = () => { if(id !== runId) throw "abort"; };
    return {
      tw: async (n, f, o) => { chk(); await tween(n, f, o); chk(); },
      all: async (...ps) => { chk(); await Promise.all(ps); chk(); },
      wait: async ms => { chk(); await sleep(ms); chk(); }
    };
  }
  function pop(text, x, y, opt){
    const o0 = Object.assign({ size:28, color:"#E2557F", hold:800 }, opt);
    const t = mk("text", { x, y, "text-anchor":"middle", "font-size":o0.size, "font-weight":900, fill:o0.color,
      stroke:"#fff", "stroke-width":6, "paint-order":"stroke", "font-family":"inherit", class:"ctr" }, $("fx"));
    t.textContent = text;
    const total = 350 + o0.hold + 350;
    t.animate([
      { transform:"scale(.2)", opacity:0 },
      { transform:"scale(1.15)", opacity:1, offset:250/total },
      { transform:"scale(1)", opacity:1, offset:350/total },
      { transform:"scale(1) translateY(0px)", opacity:1, offset:(350+o0.hold)/total },
      { transform:"scale(1) translateY(-14px)", opacity:0 }
    ], { duration:total, easing:"ease-out", fill:"forwards" }).finished.then(() => t.remove(), () => t.remove());
  }
  function sparkle(x, y, n){
    for(let i=0;i<n;i++){
      const s = mk("text", { x, y, "font-size":18, "text-anchor":"middle", fill:["#FFC21A","#FF7FA6","#4FA3E8"][i%3] }, $("fx"));
      s.textContent = "★";
      const a = Math.PI*2*i/n, r = 34 + Math.random()*18;
      s.animate([{ transform:"translate(0px,0px) scale(.3)", opacity:1 },
                 { transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(1)`, opacity:0 }],
        { duration:750, easing:"ease-out", fill:"forwards" }).finished.then(() => s.remove(), () => s.remove());
    }
  }
  function happy(on){
    $("eyesOpen").style.display = on ? "none" : "";
    $("eyesHappy").style.display = on ? "" : "none";
    $("armPeace").style.display = on ? "" : "none";
    $("armRDown").style.display = on ? "none" : "";
  }

  // ひなこの いち
  // さいしょは まんなか、かたづけた あとは みぎはしで まつ（かたづけた ものを かくさない）
  const HOME = 400, REST = 715, HY = 592, HS = 1.05;
  let hx = HOME;
  const hPos = x => `translate(${x}px,${HY}px) scale(${HS})`;
  const clampX = x => Math.max(-40, Math.min(720, x));
  async function walkTo(r, x, carried){
    x = clampX(x);
    const dist = Math.abs(x - hx);
    if(dist < 4) return;
    const dur = Math.max(350, dist * 2.4);
    const bob = $("hinakoBob").animate([{ transform:"translateY(0px)" }, { transform:"translateY(-8px)" }, { transform:"translateY(0px)" }],
      { duration:300, iterations:Math.ceil(dur/300) });
    const ticks = []; for(let t=0; t<dur; t+=300) ticks.push(setTimeout(sfx.step, t));
    const jobs = [tween($("hinakoPos"), [{ transform:hPos(hx) }, { transform:hPos(x) }], { duration:dur, easing:"ease-in-out" })];
    if(carried) jobs.push(tween(carried.el, [{ transform:carryT(carried, hx) }, { transform:carryT(carried, x) }], { duration:dur, easing:"ease-in-out" }));
    try{ await r.all(...jobs); }
    finally{ bob.cancel(); ticks.forEach(clearTimeout); }
    hx = x;
  }
  const CARRY_Y = 510; // おなかの まえで もつ
  const carryT = (it, x) => tf(x, CARRY_Y, 0, Math.min(it.m[3], it.step === 3 ? .7 : 1));

  async function tidyItem(r, it){
    await walkTo(r, it.m[0]);
    sfx.pick();
    $("carry").appendChild(it.el);
    await r.tw(it.el, [{ transform:messT(it) }, { transform:tf((it.m[0]+hx)/2, Math.min(it.m[1], CARRY_Y) - 60, it.m[2]/2, it.m[3]) , offset:.5 }, { transform:carryT(it, hx) }], { duration:450 });
    await walkTo(r, it.t[0], it);
    await r.tw(it.el, [{ transform:carryT(it, hx) }, { transform:tf((hx+it.t[0])/2, Math.min(CARRY_Y, it.t[1]) - 50, 0, it.t[3], it.t[4]), offset:.5 }, { transform:tidyT(it) }], { duration:500 });
    $("dst-" + it.dst).appendChild(it.el);
    sfx.place();
    sparkle(it.t[0], it.t[1], 5);
  }

  async function playCheck(r, celebrate){
    const lens = $("lens");
    lens.style.opacity = 1;
    const path = [[150,520],[330,560],[520,515],[720,560],[600,590],[300,590]];
    let prev = path[0];
    lens.style.transform = `translate(${prev[0]}px,${prev[1]}px)`;
    for(const p of path.slice(1)){
      await r.tw(lens, [{ transform:`translate(${prev[0]}px,${prev[1]}px)` }, { transform:`translate(${p[0]}px,${p[1]}px)` }], { duration:700 });
      pop("✓", p[0], p[1] - 40, { size:30, color:"#2F9E5A", hold:300 });
      tone(880, .1, { type:"triangle", gain:.12 });
      prev = p;
    }
    await r.tw(lens, [{ opacity:1 }, { opacity:0 }], { duration:300 });
    if(!celebrate) return;
    happy(true);
    sfx.ok();
    pop("ゆかに なにも ないね！", 400, 120, { size:30, hold:1400 });
    sparkle(400, 470, 10);
    await r.wait(1600);
    happy(false);
  }

  // 3ぷんの あいだも、いっしょに かたづけている うごきを つづける
  const STEP_MS = 180000;
  const BUSY_WORDS = ["よいしょ", "ふんふん♪", "どこかな？", "きれいに なあれ", "あった！"];
  const CHEER_WORDS = ["がんばれ！", "いっしょに がんばろう！", "きれいに なってきたね", "あと すこし！"];
  const CHECK_WORDS = ["よーく みて", "おちてないかな？", "ここも だいじょうぶ！"];
  async function crouch(r){
    await r.tw($("hinakoBob"), [
      { transform:"translateY(0px) scale(1,1)" },
      { transform:"translateY(0px) scale(1.05,.86)", offset:.45 },
      { transform:"translateY(0px) scale(1,1)" }
    ], { duration:700 });
  }
  async function busyUntil(r, until, words){
    while(Date.now() < until - 2500){
      await walkTo(r, 120 + Math.random()*560);
      await crouch(r);
      pop(words[Math.floor(Math.random()*words.length)], hx, 285, { size:24, color:"#2F7CC0", hold:700 });
      if(words === BUSY_WORDS) sparkle(hx, 560, 4);
      await r.wait(900 + Math.random()*900);
    }
    const left = until - Date.now();
    if(left > 0) await r.wait(left);
  }

  /* ---------- state ---------- */
  function setState(i){
    runId++;
    document.getAnimations().forEach(a => { try{ a.cancel(); }catch(e){} });
    $("fx").innerHTML = "";
    // ちらかって いる ものは あとの だんかいほど したに
    [...ITEMS].sort((a, b) => b.step - a.step).forEach(it => {
      if(it.step < i){ $("dst-" + it.dst).appendChild(it.el); it.el.style.transform = tidyT(it); }
      else { $("mess").appendChild(it.el); it.el.style.transform = messT(it); }
    });
    hx = HOME;
    $("hinakoPos").style.transform = hPos(hx);
    $("hinakoBob").style.transform = "none";
    $("lens").style.opacity = 0;
    happy(i >= STEPS.length);
  }

  /* ---------- progress / jump ---------- */
  const stepsUl = $("steps");
  const chips = STEPS.map((s, i) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.innerHTML = `<span class="n"><span>${i+1}</span></span>${s.chip}`;
    b.addEventListener("click", () => { $("doneOver").hidden = true; $("startOver").hidden = true; ac(); show(i); });
    li.appendChild(b); stepsUl.appendChild(li);
    return b;
  });
  function paintChips(cur){
    chips.forEach((c, i) => {
      c.classList.toggle("fin", i < cur);
      c.classList.toggle("now", i === cur);
      c.setAttribute("aria-current", i === cur ? "step" : "false");
    });
  }

  /* ---------- 3ぷん タイマー: いっぱいに なったら 「かたづいたかな？」 ---------- */
  let started = 0, cycle = 0, clockTimer = 0, labelTimer = 0;
  const fmt = sec => `${Math.floor(sec/60)}:${String(sec%60).padStart(2, "0")}`;
  function setBar(f, jump){
    const b = $("barFill");
    if(jump){ b.style.transition = "none"; b.style.width = f*100 + "%"; void b.offsetWidth; b.style.transition = ""; }
    else b.style.width = f*100 + "%";
  }
  function startClock(){
    started = Date.now(); cycle = 0;
    clearInterval(clockTimer);
    setBar(0, true);
    tickClock();
    clockTimer = setInterval(tickClock, 500);
  }
  function tickClock(){
    const ms = Date.now() - started;
    const c = Math.floor(ms / STEP_MS), inCycle = ms - c*STEP_MS;
    if(c > cycle){ cycle = c; askNow(); setBar(0, true); }
    setBar(inCycle / STEP_MS);
    $("clock").textContent = fmt(Math.ceil((STEP_MS - inCycle) / 1000));
  }
  function askNow(){
    sfx.ask();
    speak("かたづいたかな？");
    const l = $("barLabel");
    l.textContent = "かたづいたかな？ 👀"; l.classList.add("ask");
    clearTimeout(labelTimer);
    labelTimer = setTimeout(() => { l.textContent = "⏱ 3ぷん タイマー"; l.classList.remove("ask"); }, 15000);
  }

  /* ---------- flow ---------- */
  let cur = 0;
  const okBtn = $("okBtn"), turn = $("turn");
  async function show(i){
    cur = i;
    const s = STEPS[i];
    setState(i);
    paintChips(i);
    $("stepNo").textContent = `${i+1} / ${STEPS.length}`;
    $("title").textContent = s.title;
    $("tip").textContent = s.tip;
    okBtn.textContent = i === STEPS.length-1 ? "⭕ ぜんぶ かたづいた！" : "⭕ できた！ つぎへ";
    okBtn.disabled = false; okBtn.classList.add("ready");
    turn.textContent = i === STEPS.length-1 ? "いっしょに かくにん しよう！" : "いっしょに かたづけよう！";
    turn.className = "turn go";
    speak(s.voice);
    startClock();
    const r = runner();
    try{
      await r.wait(900);
      if(i < STEPS.length-1){
        // 3ぷんの なかで ひとつずつ かたづけて、あいだも うごいている
        const list = ITEMS.filter(it => it.step === i);
        const t0 = Date.now(), gap = (STEP_MS - 25000) / list.length;
        for(let k=0; k<list.length; k++){
          if(k) await busyUntil(r, t0 + k*gap, BUSY_WORDS);
          await tidyItem(r, list[k]);
        }
        await walkTo(r, REST);
        happy(true);
        pop("かたづいた！", REST, 285, { size:32 });
        await r.wait(1500);
        happy(false);
        for(;;) await busyUntil(r, Date.now() + 8000, CHEER_WORDS);
      } else {
        await playCheck(r, true);
        for(;;){
          await busyUntil(r, Date.now() + 6000, CHECK_WORDS);
          await playCheck(r, false);
        }
      }
    }catch(e){ if(e === "abort") return; throw e; }
  }
  function complete(){
    if(cur < STEPS.length-1){ sfx.ok(); show(cur+1); }
    else finish();
  }
  okBtn.addEventListener("click", () => { if(!okBtn.disabled) complete(); });

  function confetti(n){
    const box = $("confetti");
    const colors = ["#FF7FA6","#FFD84D","#4FA3E8","#7BD389","#FFB84D"];
    for(let i=0;i<n;i++){
      const c = document.createElement("i");
      c.style.left = Math.random()*100 + "vw";
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = (1.6 + Math.random()*1.4) + "s";
      c.style.animationDelay = (Math.random()*.4) + "s";
      box.appendChild(c);
      setTimeout(() => c.remove(), 3500);
    }
  }
  function finish(){
    clearInterval(clockTimer);
    setBar(1);
    setState(STEPS.length);
    paintChips(STEPS.length);
    okBtn.disabled = true; okBtn.classList.remove("ready");
    const stars = [...$("starRow").children];
    stars.forEach(s => s.classList.remove("on"));
    $("doneOver").hidden = false;
    stars.forEach((s, i) => setTimeout(() => { s.classList.add("on"); tone(660 + i*90, .15, { type:"triangle", gain:.15 }); }, 300 + i*200));
    setTimeout(sfx.fanfare, 1500);
    confetti(80);
    speak("ぜんぶ かたづいたね！ おへやが ぴかぴか！ ひなこちゃん すごい！");
  }

  $("startBtn").addEventListener("click", () => { ac(); $("startOver").hidden = true; show(0); });
  $("replayBtn").addEventListener("click", () => { $("doneOver").hidden = true; show(0); });

  // さいしょの えは ちらかった おへや
  setState(0);
  paintChips(0);
  $("stepNo").textContent = `1 / ${STEPS.length}`;
  $("title").textContent = STEPS[0].title;
  $("tip").textContent = STEPS[0].tip;
})();
</script>
</body>
</html>
